# Dependabot Configuration
# Automated dependency updates and security patches
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    # Group minor and patch updates together
    groups:
      # Group all dev dependencies
      dev-dependencies:
        patterns: ["*"]
        dependency-type: "development"
      # Group production dependencies separately
      production-dependencies:
        patterns: ["*"]
        dependency-type: "production"
    # Limit open PRs
    open-pull-requests-limit: 10
    # Labels for PRs
    labels:
      - "dependencies"
      - "automated"
    # Commit message prefix
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # Allow all update types including major (for manual review)
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Ignore certain packages if needed
    # ignore:
    #   - dependency-name: "next"
    #     versions: ["15.x"]  # Example: ignore major version until ready

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 5

# Security updates are enabled by default and don't need configuration
# They will create PRs for vulnerable dependencies immediately